services:
  peliculas-app:
    build: ../peliculas-backend
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://peliculas-db:5432/peliculas_db
      SPRING_DATASOURCE_USERNAME: user_peliculas
      SPRING_DATASOURCE_PASSWORD: pass_peliculas    
    depends_on:
      - peliculas-db
      

  peliculas-db:
    image: postgres:16
    environment:
      POSTGRES_DB: peliculas_db
      POSTGRES_USER: user_peliculas
      POSTGRES_PASSWORD: pass_peliculas
    volumes:
      - peliculas-data:/var/lib/postgresql/data

  descuentos-app:
    build: .
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://descuentos-db:5432/descuentos_db
      SPRING_DATASOURCE_USERNAME: user_descuentos
      SPRING_DATASOURCE_PASSWORD: pass_descuentos    
      PELICULAS_BASE_URL: http://peliculas-app:8080
    depends_on:
      - descuentos-db
      - peliculas-app

  descuentos-db:
    image: postgres:16
    environment:
      POSTGRES_DB: descuentos_db
      POSTGRES_USER: user_descuentos
      POSTGRES_PASSWORD: pass_descuentos
    volumes:
      - descuentos-data:/var/lib/postgresql/data

 

volumes:
  peliculas-data:
  descuentos-data:

